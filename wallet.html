<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyBank - Digital Wallet</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="bank-container">

        <h2>🏦 MyBank</h2>

        <h3>Digital Wallet</h3>

        <p>Current Balance</p>

        <h1 id="balance">₹0</h1>

        <input
            type="number"
            id="amount"
            placeholder="Enter Amount"
        >

        <button class="main-button" onclick="loadMoney()">
            Load Money
        </button>

        <p id="message"></p>
        <hr>

<h3>AI Fraud Check</h3>

<p>Check your transaction before processing.</p>

<input
    type="number"
    id="fraudAmount"
    placeholder="Enter Transaction Amount"
>

<button class="main-button" onclick="checkFraud()">
    Check Transaction
</button>

<p id="fraudResult"></p>

        <button class="main-button" onclick="logout()">
            Logout
        </button>

    </div>

    <script src="script.js"></script>

</body>
</html>
